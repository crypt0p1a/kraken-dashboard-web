name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: rustup target add wasm32-unknown-unknown
      # the page, in WebAssembly
      - run: cargo clippy -p kraken-dashboard-web-front --target wasm32-unknown-unknown --locked -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -t kraken-dashboard-web:ci .
      - name: Answers on its port, and serves its page to whoever logged in
        run: |
          # a password of the CI only, hashed by the image itself
          line=$(echo "the password of the ci" | docker run --rm -i kraken-dashboard-web:ci hash-password)
          hash=${line#KRAKEN_DASHBOARD_WEB_PASSWORD_HASH=}
          hash=${hash//\'/}
          docker run -d --rm --name backend -p 127.0.0.1:8080:8080 \
            -e KRAKEN_DASHBOARD_WEB_PUSH_KEY="$(openssl rand -hex 32)" \
            -e KRAKEN_DASHBOARD_WEB_PASSWORD_HASH="$hash" \
            -e KRAKEN_DASHBOARD_WEB_COOKIE_SECURE=false kraken-dashboard-web:ci
          for attempt in $(seq 1 30); do
            curl -s -o /dev/null http://127.0.0.1:8080/login && break
            sleep 1
          done
          # no session: refused, the page sends to the login
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/version)" = 401
          test "$(curl -s -o /dev/null -w '%{redirect_url}' http://127.0.0.1:8080/)" = "http://127.0.0.1:8080/login"
          # logged in: the version, the page and its WebAssembly
          curl -sf -c session -o /dev/null --data-urlencode "password=the password of the ci" \
            http://127.0.0.1:8080/login -w '%{http_code}' | grep -q 303
          curl -sf -b session http://127.0.0.1:8080/version | grep -q '"version"'
          page=$(curl -sf -b session http://127.0.0.1:8080/)
          wasm=$(echo "$page" | grep -oE 'kraken-dashboard-web-front-[0-9a-f]+_bg\.wasm' | head -1)
          test -n "$wasm"
          curl -sf -b session -o /dev/null -w '%{content_type}\n' "http://127.0.0.1:8080/$wasm" | grep -q application/wasm
          # a push not signed with its key: refused
          test "$(curl -s -o /dev/null -w '%{http_code}' -X PUT -H 'content-type: application/json' \
            -d '{"at":1,"views":[]}' http://127.0.0.1:8080/state)" = 401
          docker stop backend
      - name: Refuses to start without its key
        run: |
          set +e
          output=$(docker run --rm kraken-dashboard-web:ci 2>&1)
          code=$?
          echo "$output"
          test "$code" -eq 1 && echo "$output" | grep -q "KRAKEN_DASHBOARD_WEB_PUSH_KEY"
      - name: Refuses to start without its password
        run: |
          set +e
          output=$(docker run --rm -e KRAKEN_DASHBOARD_WEB_PUSH_KEY="$(openssl rand -hex 32)" kraken-dashboard-web:ci 2>&1)
          code=$?
          echo "$output"
          test "$code" -eq 1 && echo "$output" | grep -q "KRAKEN_DASHBOARD_WEB_PASSWORD_HASH"
